# ═══════════════════════════════════════════════════
# MovieAnimation.ai — Production Docker Compose
# ═══════════════════════════════════════════════════
# Hybrid-Cloud: Azure (frontend) + Local GPU (backend/DB)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Services on Local GPU Node (RTX 3060 / Dell GB10):
#   - Redis (job queue)
#   - PostgreSQL (runs on Windows WSL2, SSH-tunneled)
#   - MovieAnimation Backend API
#   - Nginx reverse proxy

version: '3.8'

services:
  # ─── Redis Job Queue ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: movieanimation-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movieanimation

  # ─── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movieanimation-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - previews_data:/app/previews
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - movieanimation

  # ─── Nginx Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: movieanimation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - movieanimation

networks:
  movieanimation:
    driver: bridge

volumes:
  redis_data:
    driver: local
  uploads_data:
    driver: local
  exports_data:
    driver: local
  previews_data:
    driver: local
