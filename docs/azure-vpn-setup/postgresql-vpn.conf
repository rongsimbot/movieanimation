# ═══════════════════════════════════════════════════════════════
# PostgreSQL VPN Configuration Snippets
# ═══════════════════════════════════════════════════════════════
# Copy relevant sections to your postgresql.conf and pg_hba.conf
# Location: /etc/postgresql/16/main/
# Apply: sudo systemctl restart postgresql
# ═══════════════════════════════════════════════════════════════

# ─── postgresql.conf additions ───────────────────────────────
# Add/update these lines in /etc/postgresql/16/main/postgresql.conf

# Bind to private interfaces ONLY (NOT 0.0.0.0!)
# 192.168.1.20 = Local LAN
# 100.64.2.20  = Tailscale VPN
# localhost     = Unix socket / local services
listen_addresses = '192.168.1.20,100.64.2.20,localhost'

# Port
port = 5432

# SSL Configuration
ssl = on
ssl_cert_file = '/etc/ssl/certs/postgres.crt'
ssl_key_file = '/etc/ssl/private/postgres.key'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on

# Connection limits
max_connections = 100
superuser_reserved_connections = 3

# Authentication timeout
authentication_timeout = 10s

# ─── pg_hba.conf — VPN Access Rules ──────────────────────────
# Append these lines to /etc/postgresql/16/main/pg_hba.conf
# Rules are checked top-to-bottom; first match wins

# Local Unix socket connections
local   all                 all                                     scram-sha-256

# Local LAN (trusted internal network — Dell GB10, laptops)
host    all                 all             192.168.1.0/24          scram-sha-256

# --- Tailscale VPN Connections ---

# Azure App Service → movieanimation_db (read/write)
host    movieanimation_db   sim_admin       100.64.1.10/32          scram-sha-256
host    movieanimation_db   sim_admin       100.64.1.0/24           scram-sha-256

# Azure App Service → read-only reporting user
# host  movieanimation_db   app_readonly    100.64.1.10/32          scram-sha-256

# Dell GB10 (MAP-API) → movieanimation_db
host    movieanimation_db   sim_admin       100.64.2.10/32          scram-sha-256

# Admin laptop via Tailscale → full access
host    all                 sim_admin       100.64.2.50/32          scram-sha-256
host    all                 sim_admin       100.64.2.0/24           scram-sha-256

# --- Replication (if needed) ---
# host  replication         replicator      192.168.1.0/24          scram-sha-256

# --- DENY everything else ---
host    all                 all             0.0.0.0/0               reject

# ─── SSL Certificate Generation (if not already done) ──────────
# Generate a self-signed certificate:
#
# sudo openssl req -new -x509 -days 365 -nodes \
#   -text \
#   -out /etc/ssl/certs/postgres.crt \
#   -keyout /etc/ssl/private/postgres.key \
#   -subj "/CN=rtx3060-db"
#
# sudo chmod 600 /etc/ssl/private/postgres.key
# sudo chown postgres:postgres /etc/ssl/private/postgres.key
# sudo chown postgres:postgres /etc/ssl/certs/postgres.crt

# ─── Verification Commands ───────────────────────────────────
# After restarting PostgreSQL, verify:
#
# 1. Check listening interfaces:
#    sudo ss -tlnp | grep 5432
#    # Expected: 192.168.1.20:5432, 100.64.2.20:5432, 127.0.0.1:5432
#    # NOT expected: 0.0.0.0:5432 or *:5432
#
# 2. Test local connection:
#    psql -U sim_admin -d movieanimation_db -c "SELECT 1"
#
# 3. Test via Tailscale IP:
#    psql "postgresql://sim_admin@100.64.2.20:5432/movieanimation_db?sslmode=require" -c "SELECT version()"
#
# 4. Verify SSL:
#    psql "postgresql://sim_admin@100.64.2.20:5432/movieanimation_db?sslmode=require" -c "SHOW ssl"
#    # Should return: on
