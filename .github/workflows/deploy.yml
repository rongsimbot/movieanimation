# ═════════════════════════════════════════════════════════
# MovieAnimation.ai — CI/CD Pipeline
# ═════════════════════════════════════════════════════════
# Triggers on push to main/ronnie branches
#
# Jobs:
#   1. TypeScript type-check (backend + frontend)
#   2. Next.js production build
#   3. Deploy to production server via SSH

name: CI/CD Pipeline

on:
  push:
    branches: [main, ronnie]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production?'
        type: boolean
        default: false

env:
  NODE_VERSION: '20'

jobs:
  # ─── TypeScript Type Check ───────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Type Check Backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check Frontend
        working-directory: frontend
        run: npx tsc --noEmit

  # ─── Next.js Production Build ────────────────────────
  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npx next build

      - name: Verify Build Output
        working-directory: frontend
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful — .next directory exists"
            echo "Routes:"
            ls .next/server/app/ 2>/dev/null || echo "  (checking...)"
          else
            echo "❌ Build failed — .next directory missing"
            exit 1
          fi

  # ─── Deploy to Production Server ─────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_production == 'true'
    environment:
      name: production
      url: https://movieanimation.ai
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/lo/.openclaw/workspace/projects/movieanimation
            git pull origin main
            bash deploy.sh --full --skip-tests

      - name: Smoke Test - Health Check
        run: |
          sleep 5
          curl -f --max-time 10 https://movieanimation.ai/api/health || echo "⚠️ Health check failed (may need DNS/VPN)"

      - name: Smoke Test - Auth Endpoint
        run: |
          curl -f --max-time 10 https://movieanimation.ai/api/auth/login -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"test"}' || echo "⚠️ Auth check failed (expected 401 — endpoint is alive)"
