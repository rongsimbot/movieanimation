# ═══════════════════════════════════════════════════════════
# MovieAnimation.ai — Azure App Service Deployment
# GitHub Actions Workflow
# ═══════════════════════════════════════════════════════════
# Deploys the Next.js frontend to Azure App Service with
# VNet integration for secure VPN access to local backend.
#
# Required GitHub Secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE — From Azure Portal → App Service → Get Publish Profile
#   TAILSCALE_AUTH_KEY           — From Tailscale admin console
# ═══════════════════════════════════════════════════════════

name: Deploy Frontend to Azure

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'infrastructure/azure/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: movieanimation-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      # ─── Checkout ───────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Setup Node.js ──────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # ─── Install Dependencies ───────────────────────
      - name: Install dependencies
        run: npm ci

      # ─── Lint (Phase 11: Quality Gate) ─────────────
      - name: Lint check
        run: npm run lint
        continue-on-error: true  # Non-blocking for now

      # ─── Build Next.js ─────────────────────────────
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://100.64.0.1:3001/api' }}
          NEXT_PUBLIC_SITE_URL: https://movieanimation.ai
          NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID || '' }}
        run: npm run build

      # ─── Run Tests ─────────────────────────────────
      - name: Run tests
        run: npm test
        continue-on-error: true  # Non-blocking for now

      # ─── Deploy to Azure App Service ───────────────
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./frontend/.next

      # ─── Health Check ──────────────────────────────
      - name: Health check
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://movieanimation.ai || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Frontend is healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting..."
            sleep 10
          done
          echo "⚠️ Health check failed after 5 attempts"
          exit 1

      # ─── Notification ──────────────────────────────
      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful: https://movieanimation.ai"
          else
            echo "❌ Deployment failed! Check logs."
          fi
